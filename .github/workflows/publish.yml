name: Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

# The group MUST NOT collide with the one ci.yml declares. Inside a called
# workflow, `github.workflow` resolves to the CALLER's name and `github.ref` to
# the caller's ref, so ci.yml's own group evaluates to the same string this one
# would if it used `github.workflow`. The callee then waits on a group its own
# caller holds, and the run dies before either job starts -- which is what
# happened to the first v0.14.0 tag push.
concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Run the full check + integration + e2e + package gate on the tagged
  # commit before publishing. No path filter -- a release tag must always
  # run the gate, whatever files the tagged commit happens to touch.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/pi-claude-marketplace
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Publish to npm
        run: npm publish --access public --provenance

  # Create the GitHub release from the CHANGELOG.md section matching the tag.
  # taiki-e/create-gh-release-action extracts the section and creates the
  # release in one step; its parser (taiki-e/parse-changelog) reads this
  # repository's changelog format directly, so no extraction script is needed.
  # allow-missing-changelog defaults to false, so a tag with no changelog
  # section fails the job rather than publishing an empty release.
  # needs: [publish] -- a release page must not announce a version that is
  # not yet on npm.
  release:
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create the GitHub release
        uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
