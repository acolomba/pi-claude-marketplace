name: SonarCloud Analysis

on:
  push:
    branches:
      - main
    # Markdown is NOT ignored: this job runs `npm run test:coverage`, whose
    # unit suite includes tests/architecture/catalog-uat.test.ts, and that
    # test reads docs/output-catalog.md. Ignoring docs here would skip the
    # coverage run that executes it. See ci.yml for the full reasoning.
    paths-ignore:
      - "images/**"
      - "demos/**"
      - ".planning/**"
      - "COPYING"
  pull_request:
    branches:
      - main
    # Markdown is NOT ignored: this job runs `npm run test:coverage`, whose
    # unit suite includes tests/architecture/catalog-uat.test.ts, and that
    # test reads docs/output-catalog.md. Ignoring docs here would skip the
    # coverage run that executes it. See ci.yml for the full reasoning.
    paths-ignore:
      - "images/**"
      - "demos/**"
      - ".planning/**"
      - "COPYING"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sonarcloud:
    # Secrets are unavailable to Dependabot and fork-originated PRs.
    if: >-
      github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The unit half of `npm run test:coverage` is the verified capture, so
      # the LCOV Sonar reads is Node's own report from an accepted bundle
      # (D-01). This job makes its own capture and binds its own runtime, so it
      # qualifies the installed producer here the way ci.yml's check job does.
      - name: Qualify the coverage producer on this runtime
        run: |
          npm run coverage:producer:build -- --verify
          npm run coverage:producer:check

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
