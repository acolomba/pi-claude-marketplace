name: SonarCloud Analysis

on:
  push:
    branches:
      - main
    # Markdown is NOT ignored: this job runs `npm run test:coverage`, whose
    # unit suite includes tests/architecture/catalog-uat.test.ts, and that
    # test reads docs/output-catalog.md. Ignoring docs here would skip the
    # coverage run that executes it. See ci.yml for the full reasoning.
    paths-ignore:
      - "images/**"
      - "demos/**"
      - ".planning/**"
      - "COPYING"
  pull_request:
    branches:
      - main
    # Markdown is NOT ignored: this job runs `npm run test:coverage`, whose
    # unit suite includes tests/architecture/catalog-uat.test.ts, and that
    # test reads docs/output-catalog.md. Ignoring docs here would skip the
    # coverage run that executes it. See ci.yml for the full reasoning.
    paths-ignore:
      - "images/**"
      - "demos/**"
      - ".planning/**"
      - "COPYING"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sonarcloud:
    # Secrets are unavailable to Dependabot and fork-originated PRs.
    if: >-
      github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
