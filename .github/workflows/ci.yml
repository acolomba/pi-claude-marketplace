name: CI

on:
  # publish.yml calls this workflow on v* tags (unfiltered) so a release
  # always runs the full gate before publishing.
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: false
  push:
    branches:
      - main
    # Build inputs. The npm-check hook in .pre-commit-config.yaml lists the same files.
    paths: &build_inputs
      - "extensions/**"
      - "test/**"
      - "features/**"
      - "cucumber.json"
      - "rule-packs/**"
      - "scripts/**/*.mjs"
      - "demos/**/*.ts"
      - "docs/output-catalog.md"
      - "docs/json-output.md"
      - ".github/workflows/**"
      - ".editorconfig"
      - ".fallowrc.json"
      - ".gitattributes"
      - ".gitignore"
      - ".prettierignore"
      - ".prettierrc.json"
      - "eslint.config.js"
      - "package-lock.json"
      - "package.json"
      - "sonar-project.properties"
      - "tsconfig.json"
  pull_request:
    branches:
      - main
    paths: *build_inputs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# D-01: single-Node-version matrix. Node 24 only -- the latest stable LTS line
# at the time of Phase 1 planning. Justification (per CONTEXT.md):
#   - Node 24 satisfies write-file-atomic@^8's `^22.22.2 || ^24.15.0 || >=26.0.0`
#     engine floor.
#   - Node 24 supports native TS strip (no `tsx`, no `--experimental-strip-types`).
#   - Multi-version matrix maintenance overhead is not justified for V1.
#
# Note: ROADMAP.md Phase 1 success criterion 5 originally specified Node
# 22/24/26. D-01 supersedes that with single-version Node 24. If a future
# audit reopens this, add `node-version: [22, 24, 26]` and a `strategy.matrix`
# block; the rest of the workflow is matrix-ready.

jobs:
  static:
    name: static checks (Node 24)
    runs-on: ubuntu-latest
    # A cold ESLint cache makes the lint the slowest step. The ceiling is sized
    # for a slower runner, not for the measured time.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Typed ESLint rules read other files' types, but the ESLint cache keys
      # each result to the file's own content and the configuration, so a
      # cached pass can be stale. The clean install already starts without
      # node_modules. Removing the cache directory keeps the lint in
      # `check:static` fresh even if node_modules is ever cached. CI is the
      # backstop for cached local lint runs.
      - name: Clear the ESLint cache
        run: rm -rf node_modules/.cache/eslint

      - name: Run the static checks
        # NFR-6: type checking, ESLint, the workflow install-script check,
        # Fallow, Prettier, and source/test pairing, in parallel.
        run: npm run check:static

      - name: Run the unit tests that have no source pair
        run: npm run test:unpaired

  integration:
    name: integration tests (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # npm run test:integration first runs scripts/install-test-peers.mjs,
      # which installs pi-mcp-adapter, pi-subagents, and pi-dynamic-workflows at
      # the floors that package.json declares. PIFL-03 keeps them out of the
      # lockfile.
      - name: Run the integration tests
        run: npm run test:integration

  # D-CF1-16: the behavioral tests run as two path shards, lifecycle and
  # components, so the component scenarios that start a profile Pi do not
  # lengthen the lifecycle run. fail-fast is off, so one shard's failure does
  # not hide the other's result. Each timeout is at least 1.5 times the
  # shard's measured run and never below 15 minutes.
  # test/architecture/behavioral-shard-coverage.test.ts fails when a feature
  # file is in no shard or in two, so a new directory cannot drop out of CI.
  #
  # Measured 2026-11-01, ESTIMATED: the branch was not on origin, so no CI run
  # was dispatched. Local runs on 4 cores with `--parallel 8`, twice each in
  # random order: lifecycle 94 s and 102 s (1158 scenarios), components 35 s
  # and 35 s (11 scenarios). Doubled for a 4-vCPU hosted runner, that is
  # about 3.4 and 1.2 minutes, so both shards take the 15-minute floor.
  # Re-measure after each component merge, and raise a timeout that no
  # longer holds 1.5 times its shard's run.
  behavioral:
    name: behavioral tests, ${{ matrix.shard }} (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: lifecycle
            paths: features/marketplace features/plugin
          - shard: components
            paths: >-
              features/skill features/slash-command features/agent features/hook features/mcp-server features/workflow
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # npm run test:cucumber first runs scripts/install-test-peers.mjs, which
      # installs the three companions at their declared floors. The shard's
      # paths reach the shell only through the environment (zizmor template
      # injection), and the unquoted expansion splits them into arguments.
      - name: Run the behavioral tests
        env:
          SHARD_PATHS: ${{ matrix.paths }}
        run: npm run test:cucumber -- $SHARD_PATHS

  sonarcloud:
    needs: [direct-coverage]
    # Release tags keep the complete test gate but do not need another scan.
    # Fork and Dependabot runs cannot access the Sonar token.
    if: >-
      github.ref_type != 'tag' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      pull-requests: read
    uses: $/.github/workflows/sonarcloud.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  e2e-tests:
    name: pinned e2e tests (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install exact Pi peer-floor fixture
        run: npm --prefix test/e2e/pi-peer-floor ci --ignore-scripts

      - name: Run pinned e2e tests
        run: npm run test:e2e

  # RCOV-03 asks for a dedicated authoritative job rather than a step folded
  # into another job (D-08-16), so a coverage shortfall shows as its own red
  # signal. Every event measures every source-test pair over the whole tree,
  # one focused test run per pair. A change to shared test support can lower
  # the direct coverage of a pair that it never names, and only a whole-tree
  # run sees that before merge. The run takes about two minutes on a hosted
  # runner. The ceiling is sized for a slower runner.
  #
  # The run also writes coverage/direct.lcov, which merges the record of each
  # pair for its own source. The sonarcloud job reads it.
  direct-coverage:
    name: direct coverage (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run direct coverage for every pair
        run: npm run test:coverage:direct:all

      - name: Save the direct coverage report
        uses: actions/upload-artifact@v7
        with:
          name: direct-coverage-lcov
          path: coverage/direct.lcov
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  package:
    name: package manifest
    needs: [static, integration, behavioral, e2e-tests, direct-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate package manifest
        run: npm pack --dry-run
