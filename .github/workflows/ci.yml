name: CI

on:
  # publish.yml calls this workflow on v* tags (unfiltered) so a release
  # always runs the full gate before publishing.
  workflow_call:
  push:
    branches:
      - main
    # Denylist, not an allowlist: package.json, the lockfile, tsconfig and
    # the lint config live outside extensions/ + tests/ and MUST still
    # trigger CI.
    #
    # `**/*.md` and `docs/**` were removed from this list. They rested on
    # "no test reads repo markdown", which is false:
    # tests/architecture/catalog-uat.test.ts reads `docs/output-catalog.md`
    # and byte-compares 166 annotated examples against notify() output. A
    # docs-only edit that broke that contract skipped the only gate that
    # would catch it. `paths-ignore` cannot negate a single path, so the
    # whole markdown ignore goes: over-running CI costs minutes, while
    # under-running it is indistinguishable from a pass.
    paths-ignore:
      - "images/**"
      - "demos/**"
      - ".planning/**"
      - "COPYING"
  pull_request:
    branches:
      - main
    # Same reasoning as the push trigger above: docs/output-catalog.md is
    # test-examined, so markdown cannot be ignored wholesale.
    paths-ignore:
      - "images/**"
      - "demos/**"
      - ".planning/**"
      - "COPYING"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# D-01: single-Node-version matrix. Node 24 only -- the latest stable LTS line
# at the time of Phase 1 planning. Justification (per CONTEXT.md):
#   - Node 24 satisfies write-file-atomic@^8's `^22.22.2 || ^24.15.0 || >=26.0.0`
#     engine floor.
#   - Node 24 supports native TS strip (no `tsx`, no `--experimental-strip-types`).
#   - Multi-version matrix maintenance overhead is not justified for V1.
#
# Note: ROADMAP.md Phase 1 success criterion 5 originally specified Node
# 22/24/26. D-01 supersedes that with single-version Node 24. If a future
# audit reopens this, add `node-version: [22, 24, 26]` and a `strategy.matrix`
# block; the rest of the workflow is matrix-ready.

jobs:
  check:
    name: npm run check (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run full check pipeline
        # NFR-6: typecheck + ESLint + Prettier + node:test
        run: npm run check

  integration-tests:
    name: integration tests (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration

  e2e-tests:
    name: pinned e2e tests (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run pinned e2e tests
        run: npm run test:e2e

  # RCOV-03 asks for a dedicated authoritative job rather than a step folded
  # into `check` (D-08-16). The gate spawns one focused test run per changed
  # pair, so it wants its own timeout and its own legible red signal instead of
  # sitting behind a typecheck failure in the fifteen-minute composite.
  #
  # The job runs one of two scopes, chosen by event, because `origin/main...HEAD`
  # answers a real question on exactly one of the three events this workflow
  # fires on:
  #
  #   pull_request               -- the PR's commits. Branch-scoped, as designed.
  #   push: main                 -- EMPTY. origin/main IS HEAD.
  #   workflow_call (v* tag)     -- EMPTY. The tag sits on main.
  #
  # On the two non-PR events a changed-pair run would select nothing, measure
  # only the pinned pairs and exit 0, having said nothing about the commit that
  # triggered it -- while `package` depended on it as though it had. Both
  # in-job base assertions are blind to that: they check which base resolved,
  # never how large a change set it held. So those two events take the third
  # scope, the whole tree, which is the honest change set for a commit that is
  # already on main and the strongest one for a release.
  direct-coverage:
    name: direct coverage (Node 24)
    runs-on: ubuntu-latest
    # The whole-tree scope is around eight minutes locally over 230 pairs; the
    # ceiling is sized for a slower runner, not for the measured time.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # D-08-15: origin/main must exist as a ref. actions/checkout defaults
          # to a depth-1 clone in which it does not, so the gate's ordered
          # candidate chain falls through to HEAD~1 and diffs a single commit
          # while still reporting a resolved base. Fail-closed base selection
          # is worth nothing if the base it closes on is the wrong one. The
          # fallow-audit job in lint.yml sets this for the same reason.
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Whether actions/checkout at fetch-depth 0 creates
      # refs/remotes/origin/main on a pull_request event cannot be verified
      # outside GitHub Actions. This step turns a wrong assumption into a loud
      # failure rather than a silent HEAD~1 diff (D-08-15). It is scoped to the
      # event whose change set depends on that ref.
      - name: Assert the base candidate resolved
        if: github.event_name == 'pull_request'
        run: git rev-parse --verify origin/main^{commit}

      - name: Run the branch-scoped direct-coverage gate
        if: github.event_name == 'pull_request'
        # `pipefail` is set explicitly: GitHub's default shell is `bash -e`,
        # which does NOT set it, so without this the pipeline would exit with
        # tee's status and a red gate would report green.
        run: |
          set -o pipefail
          npm run test:coverage:direct | tee coverage-direct.log

      # The gate writes its selected base before either outcome, so the job can
      # assert the choice rather than trust the checkout. A regression to
      # HEAD~1 fails here instead of passing quietly (D-08-15).
      # A block scalar, because a plain YAML scalar cannot carry `: `.
      - name: Assert the gate selected origin/main
        if: github.event_name == 'pull_request'
        run: |
          grep -qx 'Changed-pair base: origin/main' coverage-direct.log

      # push: main and the v*-tag workflow_call. There is no change set to
      # select against origin/main here, so the gate measures the whole tree
      # and compares every reading against the pin.
      #
      # This arm carries no assertion step of its own, and deliberately. The
      # three steps above exist because a changed-pair run cannot tell whether
      # the base it resolved was the right question. A whole-tree run has no
      # base: it enumerates from disk, and `assertReportComplete` already reads
      # its own retained report back and refuses a run that skipped a row. An
      # added grep here would restate a check the gate performs.
      - name: Run the whole-tree direct-coverage gate
        if: github.event_name != 'pull_request'
        run: npm run test:coverage:direct:all

  package:
    name: package manifest
    needs: [check, integration-tests, e2e-tests, direct-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate package manifest
        run: npm pack --dry-run
