# SonarCloud configuration for pi-claude-marketplace.
sonar.projectKey=acolomba_pi-claude-marketplace
sonar.organization=acolomba

# Project metadata.
sonar.projectName=Pi Claude Marketplace
sonar.projectVersion=0.19.0

# Source code settings.
sonar.sources=extensions/pi-claude-marketplace,.github
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Coverage settings.
# Only the unit report is fed to Sonar, because it is the only one whose V8
# block segmentation can be merged by line number without inventing branches.
#
# `coverage/integration.lcov` and `coverage/e2e.lcov` are partial-surface
# reports: they load most of the tree but execute a fraction of it. Node's
# `--experimental-test-coverage` lcov reporter emits one BRDA record per
# *uncovered V8 block range*, keyed by the line its start offset maps to. When a
# run loads a module but never calls a given function, V8 reports that whole
# function as a single uncovered range whose start offset lands on the preceding
# doc comment, blank line, or `import` statement -- so the report grows BRDA
# records at lines that hold no branch at all. The complete report, where the
# same function *is* called, emits no record there to contradict it. Sonar
# merges lcov reports per (file, line), so it sees a line only one report
# mentions with zero covered conditions and has nothing to max it against: the
# phantom condition survives the merge and no test can ever close it.
#
# Measured locally against freshly generated reports: the three-report merge
# produced roughly 138 uncovered conditions across 74 files, of which about 130
# came from `e2e.lcov` alone at lines no other report mentions, and 3 from
# `integration.lcov` alone. Those counts are approximate -- V8 block
# segmentation is not stable between runs, which is itself the reason a metric
# built on merging it by line number is not stable either. The same merge over
# `unit.lcov` alone reports 0.
#
# Nothing is lost by dropping the two partial reports. `unit.lcov` is complete
# over the analyzed surface: it carries 227 of the 234 `.ts` files under
# `extensions/`, and the seven absentees are all type-only `types.ts` modules
# that emit no JS and therefore appear in no coverage report of any suite. This
# is not a coverage exclusion -- `sonar.sources` is untouched and every source
# file is still measured. What is removed is a measurement input that
# manufactures conditions which do not exist in the source.
#
# `npm run test:coverage` still generates all three reports; the integration and
# e2e ones remain useful in their own lanes.
#
# `npm run test:coverage:unit` writes `coverage/unit.lcov` and fails below 100%
# lines, functions and branches over `extensions/**`, so the report Sonar reads
# is the one the gate accepted (D-01).
sonar.javascript.lcov.reportPaths=coverage/unit.lcov

# Exclusions.
sonar.exclusions=.claude/**,.opencode/**,.pi/**,.planning/**,build/**,coverage/**,dist/**,node_modules/**
sonar.test.exclusions=tests/**

# Issue exclusions.
sonar.issue.ignore.multicriteria=e1
# Contradicts `import-x/order`
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S3863
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.ts

# Copy-paste detection exclusions.
# The agents and commands bridges' commitPrepared* helpers share a deliberately
# structurally-identical rollback shape (completedRenames[] + reverse-walk +
# appendLeaks, TR-01 / TR-05). Phase 38 RESEARCH Open Q1 rejected extracting
# this into a shared helper -- locality at the bridge level keeps the rollback
# contract visible alongside the commit it protects, and the deferred skills
# bridge would have been a non-adopter (premature abstraction).
#
# orchestrators/plugin/shared.ts holds two cross-scope resolution helpers
# (`resolveCrossScopePluginTarget` for plugins, `resolveInstalledMarketplaceTarget`
# for marketplaces) whose explicit-scope branches share the same SCOPE-01
# "requested scope -> other scope -> absent" decision shape. The inner
# membership check differs (plugin row vs marketplace container) and the
# return discriminators differ (CrossScopePluginResolution vs
# ScopedMarketplaceResolution), so a generic extraction would obscure the
# per-type contract that each caller switches on. The parallel structure
# is the deliberate read: both surfaces SHOULD share the same resolution
# discipline, and inlining keeps that discipline visible at each call site.
#
# The `*.messaging.ts` files are the per-verb notification counterpart to the
# bridges' stage/commit/unstage triplet: each orchestrator verb owns one, and
# each states the message contract its caller reads. That makes them
# structurally parallel by design, the same shape as the already-excluded
# bridges/{agents,commands}/stage.ts pair. Extracting the shared block into a
# generic builder would hide the per-verb contract behind an indirection, and
# the verbs' messages diverge independently as each verb's outcome union grows
# (IL-2 routes all of them through shared/notify.ts, which is where the real
# shared behavior already lives).
sonar.cpd.exclusions=extensions/pi-claude-marketplace/bridges/agents/stage.ts,extensions/pi-claude-marketplace/bridges/commands/stage.ts,extensions/pi-claude-marketplace/orchestrators/plugin/shared.ts,extensions/pi-claude-marketplace/orchestrators/import/execute.messaging.ts,extensions/pi-claude-marketplace/orchestrators/plugin/fetch.messaging.ts,extensions/pi-claude-marketplace/orchestrators/plugin/install.messaging.ts,extensions/pi-claude-marketplace/orchestrators/plugin/list.messaging.ts
