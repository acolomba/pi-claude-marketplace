exclude: ^(\.agents/|\.claude/|\.codex/|tests/domain/fixtures/hash-stability/)

default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=64"]
        exclude: ^(package-lock\.json|\.planning/)
      - id: check-json
        exclude: ^tests/orchestrators/marketplace/_fixtures/invalid-manifest/
      - id: check-yaml
      - id: check-ast
      - id: sort-simple-yaml
      - id: check-vcs-permalinks
      - id: forbid-submodules
      - id: forbid-new-submodules

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: '\.(js|json|ts)$'
        # Pin prettier to match the npm devDependency (the mirror otherwise
        # floats and CI resolved a version that reformats TS union types
        # differently from the local check).
        additional_dependencies:
          - prettier@3.9.5

  - repo: https://github.com/sirosen/texthooks
    rev: 0.7.1
    hooks:
      - id: fix-smartquotes
        exclude: ^\.planning/
      - id: alphabetize-codeowners
      - id: fix-spaces
      - id: fix-unicode-dashes
        exclude: ^\.planning/
      - id: fix-ligatures
        exclude: ^\.planning/
      - id: forbid-bidi-controls

  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.92.4
    hooks:
      - id: trufflehog

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: ["-d", "{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable}}"]

  - repo: https://github.com/google/yamlfmt
    rev: v0.20.0
    hooks:
      - id: yamlfmt
        # Historical JSON-compatible evidence exceeds yamlfmt's scanner.
        exclude: ^\.planning/inputs/unit-test-refactor-handoff/TRANSFORMATIONS\.yaml$

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-frontmatter
          - mdformat-gfm
          - mdformat-gfm-alerts
        exclude: ^(tests/fixtures/|tests/bridges/_fixtures/|\.planning/)

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.20.0
    hooks:
      - id: markdownlint-cli2
        exclude: ^(tests/fixtures/|tests/bridges/_fixtures/|\.planning/)

  - repo: local
    hooks:
      # Every hook below runs the WHOLE project (pass_filenames: false); the
      # `files:` pattern only decides WHETHER it runs. So each pattern must
      # name every path that can change that tool's verdict.
      #
      # All four read tests/ as well as extensions/, because tsconfig.json's
      # `include` is ["extensions/**/*.ts", "tests/**/*.ts"], `npm run lint` is
      # `eslint extensions tests scripts eslint.config.js`, prettier globs
      # `**/*.{js,json,ts}` plus `scripts/**/*.mjs`, and fallow runs whole-repo
      # with `production: false`.
      #
      # Three of the four also read scripts/, because a gate script can move
      # their verdict. Measured by planting in check-corresponding-tests.mjs:
      # an unused binding makes lint error, a misformatted statement makes
      # format:check warn, and an unused export makes fallow report
      # `scripts/check-corresponding-tests.mjs :216 plantedUnusedExport`.
      # npm-typecheck does NOT name scripts/, because tsconfig.json's `include`
      # does not reach it, so no edit there can move `tsc --noEmit`.
      #
      # Every pattern here was verified the same way: plant the violation, run
      # that hook alone on that file alone, and watch it fire instead of
      # reporting `(no files to check)Skipped`.
      #
      # Known residual gap, common to all four and NOT closable by a pattern:
      # pre-commit selects staged files with `--diff-filter=ACMRTUXB` (no `D`),
      # so a delete-only commit matches nothing and skips these hooks. Deletion
      # is exactly what orphans an export elsewhere. Measured: zero
      # delete-only commits in 173, and CI runs the full `npm run check`
      # regardless, so this is a local-feedback gap rather than a merge-gate
      # hole.
      - id: npm-lint
        name: npm lint
        entry: npm run lint
        language: system
        pass_filenames: false
        files: '^(eslint\.config\.js|tsconfig\.json|(extensions|tests)/.*\.ts|scripts/.*\.mjs|package(-lock)?\.json)$'
      - id: npm-format-check
        name: npm format check
        entry: npm run format:check
        language: system
        pass_filenames: false
        files: '^(\.prettierrc\.json|\.prettierignore|eslint\.config\.js|(extensions|tests)/.*\.ts|scripts/.*\.mjs|package(-lock)?\.json|tsconfig\.json)$'
      - id: npm-typecheck
        name: npm typecheck
        entry: npm run typecheck
        language: system
        pass_filenames: false
        files: '^((extensions|tests)/.*\.ts|package(-lock)?\.json|tsconfig\.json)$'
      - id: npm-fallow
        name: npm fallow
        entry: npm run fallow
        language: system
        pass_filenames: false
        # `.mjs` is included because `fallow dupes` analyzes
        # tests/live-uat/*.mjs -- both `duplicates.ignoredClones` entries are
        # clone groups in those two files. `.fallowrc.json` and `tsconfig.json`
        # decide what enters the graph at all.
        files: '^(\.fallowrc\.json|tsconfig\.json|eslint\.config\.js|(extensions|tests)/.*\.(ts|mjs)|scripts/.*\.mjs|package(-lock)?\.json)$'
