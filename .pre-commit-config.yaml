exclude: ^(\.agents/|\.claude/|\.codex/|tests/domain/fixtures/hash-stability/)

default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=64"]
        exclude: ^(package-lock\.json|\.planning/)
      - id: check-json
        exclude: ^tests/orchestrators/marketplace/_fixtures/invalid-manifest/
      - id: check-yaml
      - id: check-ast
      - id: sort-simple-yaml
      - id: check-vcs-permalinks
      - id: forbid-submodules
      - id: forbid-new-submodules

  - repo: https://github.com/sirosen/texthooks
    rev: 0.7.1
    hooks:
      - id: fix-smartquotes
        exclude: ^\.planning/
      - id: alphabetize-codeowners
      - id: fix-spaces
      - id: fix-unicode-dashes
        exclude: ^\.planning/
      - id: fix-ligatures
        exclude: ^\.planning/
      - id: forbid-bidi-controls

  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.92.4
    hooks:
      - id: trufflehog

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: ["-d", "{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable}}"]

  - repo: https://github.com/google/yamlfmt
    rev: v0.20.0
    hooks:
      - id: yamlfmt
        # Historical JSON-compatible evidence exceeds yamlfmt's scanner.
        exclude: ^\.planning/inputs/unit-test-refactor-handoff/TRANSFORMATIONS\.yaml$

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-frontmatter
          - mdformat-gfm
          - mdformat-gfm-alerts
          - mdformat-footnote
        exclude: ^(tests/fixtures/|tests/bridges/_fixtures/|\.planning/)

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.20.0
    hooks:
      - id: markdownlint-cli2
        exclude: ^(tests/fixtures/|tests/bridges/_fixtures/|\.planning/)

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        # --no-progress is repeated here. Setting args replaces the upstream list
        # instead of adding to it.
        args: ["--no-progress", "--config", "zizmor.yml"]

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: node_modules/.bin/prettier --write
        language: system
        files: '\.(js|json|ts)$|^scripts/.*\.mjs$'
      - id: npm-lint
        name: npm lint
        entry: npm run lint
        language: system
        pass_filenames: false
        files: '^(eslint\.config\.js|tsconfig\.json|(extensions|tests)/.*\.ts|scripts/.*\.mjs|package(-lock)?\.json)$'
      - id: npm-format-check
        name: npm format check
        entry: npm run format:check
        language: system
        pass_filenames: false
        files: '^(\.prettierrc\.json|\.prettierignore|eslint\.config\.js|(extensions|tests)/.*\.ts|scripts/.*\.mjs|package(-lock)?\.json|tsconfig\.json)$'
      - id: npm-typecheck
        name: npm typecheck
        entry: npm run typecheck
        language: system
        pass_filenames: false
        files: '^((extensions|tests)/.*\.ts|package(-lock)?\.json|tsconfig\.json)$'
      - id: npm-fallow
        name: npm fallow
        entry: npm run fallow
        language: system
        pass_filenames: false
        files: '^(\.fallowrc\.json|tsconfig\.json|eslint\.config\.js|(extensions|tests)/.*\.(ts|mjs)|scripts/.*\.mjs|package(-lock)?\.json)$'
      # Fails any workflow that installs npm packages without --ignore-scripts.
      # It runs on the change itself, before the code is committed.
      - id: workflow-install-scripts
        name: npm lint workflows
        entry: npm run lint:workflows
        language: system
        pass_filenames: false
        files: '^\.github/workflows/.*\.ya?ml$'
      # RCOV-03. The same changed-pair gate the CI `direct-coverage` job runs,
      # at the same strictness, with a commit-scoped base instead of the
      # branch-scoped default (D-08-A07). Cost: one focused test run per pair
      # this commit touches, plus the pinned pairs the gate always measures.
      # The pin file is listed so a pin edit re-runs the comparison.
      - id: npm-coverage-direct
        name: npm direct coverage (changed pairs)
        entry: npm run test:coverage:direct:commit
        language: system
        pass_filenames: false
        files: '^(extensions/pi-claude-marketplace/.*\.ts|tests/.*\.ts|scripts/test-coverage-direct\.pin\.json)$'
      # MEMBER-01. The whole-project unread-member gate. `pass_filenames` is
      # false because the gate analyses the entire program in one pass: the
      # change it exists to catch is the removal of the sole reader of a member
      # declared in a DIFFERENT file, which a per-file invocation cannot see.
      # Cost: one whole-program analysis, roughly 85 seconds.
      - id: npm-type-members
        name: npm type members
        entry: npm run lint:type-members
        language: system
        pass_filenames: false
        files: '^(scripts/check-unused-type-members(\.[a-z]+)?\.(mjs|json)|(extensions|tests)/.*\.ts|tsconfig\.json|package(-lock)?\.json|\.pre-commit-config\.yaml)$'
      # MEMBER-02. The sensitivity controls around that gate, which plant a real
      # offender into a real declaration and require the gate to report it.
      #
      # The trigger is deliberately NARROWER than the gate's own: these controls
      # measure whether the GATE can still see an offender, and that question is
      # settled by the analyzer, its decision and contract records, the compiler
      # inputs, and the declaration the plant goes into -- never by an ordinary
      # edit under extensions/. Cost: five whole-program analyses, roughly seven
      # minutes and 2.1 GiB, which is why it does not ride on every `.ts` commit.
      # It still runs in full on every `npm run check`, local and CI alike.
      - id: npm-type-members-negative
        name: npm type members (negative controls)
        entry: npm run lint:type-members:negative
        language: system
        pass_filenames: false
        files: '^(scripts/check-unused-type-members(\.[a-z]+)?\.(mjs|json)|extensions/pi-claude-marketplace/edge/types\.ts|tests/edge/types\.test\.ts|tsconfig\.json|package(-lock)?\.json|\.pre-commit-config\.yaml)$'
      # METRIC-01 / D-10. The verified unit capture: one native unit run whose
      # LCOV, Istanbul map and accepted manifest are bound to the tree by
      # content. This hook is the producer. It reuses the published bundle when
      # `coverage:validate` accepts it against the staged tree now (a bundle
      # that `npm run check` or an earlier commit made of these exact bytes);
      # otherwise it runs the unit suite once, about eight minutes. The trigger
      # is the inventory an accepted bundle binds: production sources and their
      # resources, the unit test tree, the tooling, the vendored producer and
      # the configuration files. A change none of them carries cannot stale the
      # bundle, so it runs nothing here. Workflows are not bundle inputs; the
      # `workflow-install-scripts` hook is their gate.
      - id: npm-coverage-unit
        name: npm unit coverage (verified bundle)
        entry: npm run coverage:unit:current
        language: system
        pass_filenames: false
        files: '^(extensions/.*|tests/(?!e2e/|integration/|live-uat/).*|scripts/.*|vendor/coverage/.*|\.fallowrc\.json|\.pre-commit-config\.yaml|\.prettierignore|\.prettierrc\.json|eslint\.config\.js|package(-lock)?\.json|sonar-project\.properties|tsconfig\.json)$'
      # METRIC-02 / D-06. The CRAP policy of 30 over every production function,
      # read from the bundle the hook above produced. The consumer validates the
      # bundle again and refuses a missing or stale one; it never captures. The
      # negative runners of both tools ride inside the unit suite itself
      # (`tests/scripts/*.negative.test.ts`), so a fresh capture has already
      # exercised them on this tree.
      - id: npm-coverage-risk
        name: npm coverage risk
        entry: npm run coverage:risk
        language: system
        pass_filenames: false
        files: '^(extensions/.*|tests/(?!e2e/|integration/|live-uat/).*|scripts/.*|vendor/coverage/.*|\.fallowrc\.json|\.pre-commit-config\.yaml|\.prettierignore|\.prettierrc\.json|eslint\.config\.js|package(-lock)?\.json|sonar-project\.properties|tsconfig\.json)$'
