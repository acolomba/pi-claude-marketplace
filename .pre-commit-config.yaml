exclude: ^(\.agents/|\.claude/|\.codex/|tests/domain/fixtures/hash-stability/)

default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=64"]
        exclude: ^(package-lock\.json|\.planning/)
      - id: check-json
        exclude: ^tests/orchestrators/marketplace/_fixtures/invalid-manifest/
      - id: check-yaml
      - id: check-ast
      - id: sort-simple-yaml
      - id: check-vcs-permalinks
      - id: forbid-submodules
      - id: forbid-new-submodules

  - repo: https://github.com/sirosen/texthooks
    rev: 0.7.1
    hooks:
      - id: fix-smartquotes
        exclude: ^\.planning/
      - id: alphabetize-codeowners
      - id: fix-spaces
      - id: fix-unicode-dashes
        exclude: ^\.planning/
      - id: fix-ligatures
        exclude: ^\.planning/
      - id: forbid-bidi-controls

  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.92.4
    hooks:
      - id: trufflehog

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: ["-d", "{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable}}"]

  - repo: https://github.com/google/yamlfmt
    rev: v0.20.0
    hooks:
      - id: yamlfmt
        # Historical JSON-compatible evidence exceeds yamlfmt's scanner.
        exclude: ^\.planning/inputs/unit-test-refactor-handoff/TRANSFORMATIONS\.yaml$

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-frontmatter
          - mdformat-gfm
          - mdformat-gfm-alerts
          - mdformat-footnote
        exclude: ^(tests/fixtures/|tests/bridges/_fixtures/|\.planning/)

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.20.0
    hooks:
      - id: markdownlint-cli2
        exclude: ^(tests/fixtures/|tests/bridges/_fixtures/|\.planning/)

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        # --no-progress is repeated here. Setting args replaces the upstream list
        # instead of adding to it.
        args: ["--no-progress", "--config", "zizmor.yml"]

  - repo: local
    hooks:
      # Same files as `npm run format`: the JavaScript, JSON, and TypeScript
      # build inputs.
      - id: prettier
        name: prettier
        entry: node_modules/.bin/prettier --write --cache --cache-strategy content
        language: system
        files: '^((extensions|rule-packs|tests)/.*\.(js|json|ts)|scripts/.*\.(json|mjs)|demos/.*\.ts|\.fallowrc\.json|\.prettierrc\.json|eslint\.config\.js|package(-lock)?\.json|tsconfig\.json)$'
      # Includes deletions and shared inputs. Commits run incremental checks
      # only: tool and config changes select the cached broad check, and the
      # full `npm run check` runs at completion and in CI.
      - id: npm-check-changed
        name: npm changed checks
        entry: npm run check:changed
        language: system
        pass_filenames: false
        always_run: true
